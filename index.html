<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="A simple starting point for your website.">
		<title>My Website</title>
		<style>
			* { box-sizing: border-box; }
			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				padding: 24px;
				color: #172033;
				background: #f4f6fb;
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			}
			main {
				width: min(100%, 640px);
				padding: 48px 32px;
				text-align: center;
				background: #fff;
				border: 1px solid #e5e9f2;
				border-radius: 16px;
				box-shadow: 0 16px 48px rgb(23 32 51 / 8%);
			}
			h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.5rem); }
			p { margin: 0; color: #596579; line-height: 1.6; }
		</style>
	</head>
	<body>
		<main>
			<h1>Welcome to My Website</h1>
			<p>Your website is ready to get started.</p>
		</main>
	</body>
</html>
